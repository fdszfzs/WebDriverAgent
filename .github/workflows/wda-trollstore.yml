name: wda-trollstore
"on":
  workflow_dispatch:
env:
  OUT_IPA: ${{ github.workspace }}/WebDriverAgent-TrollStore.ipa
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Build WebDriverAgentRunner Release iphoneos, fully unsigned
        run: >
          xcodebuild clean build
          -project WebDriverAgent.xcodeproj
          -scheme WebDriverAgentRunner
          -destination "generic/platform=iOS"
          -configuration Release
          -derivedDataPath appium_wda_ios
          ARCHS=arm64
          IPHONEOS_DEPLOYMENT_TARGET=15.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA with the frameworks xcodebuild embedded
        run: |
          set -eux
          SRC=$(find appium_wda_ios/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "WebDriverAgentRunner-Runner.app" | head -1)
          test -n "$SRC"
          test -d "$SRC"
          rm -rf Payload
          mkdir Payload
          cp -R "$SRC" Payload/
          APP=Payload/WebDriverAgentRunner-Runner.app
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} +
          find "$APP" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$APP" -name ".ldid*" -delete
          find "$APP" -name "embedded.mobileprovision" -delete
          DEV=$(xcode-select -p)
          mkdir -p "$APP/Frameworks"
          # Xcode 15.4 links XCUIAutomation, not a separate XCUITest.framework.
          # Copy XCUITest only when the iPhoneOS platform has exactly one.
          hits=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            hits+=("$line")
          done < <(find "$DEV/Platforms/iPhoneOS.platform" \( -type d -o -type l \) -name "XCUITest.framework")
          echo "found ${#hits[@]} XCUITest.framework under iPhoneOS platform"
          if [ "${#hits[@]}" -gt 0 ]; then
            printf "%s\n" "${hits[@]}"
          fi
          if [ "${#hits[@]}" -gt 1 ]; then
            echo "refusing to guess XCUITest.framework"
            exit 1
          fi
          if [ "${#hits[@]}" -eq 1 ] && [ ! -e "$APP/Frameworks/XCUITest.framework" ]; then
            cp -R "${hits[0]}" "$APP/Frameworks/"
          fi
          for name in XCTest XCUIAutomation XCTAutomationSupport XCTestCore XCTestSupport XCUnit; do
            test -d "$APP/Frameworks/${name}.framework"
            find "$APP/Frameworks/${name}.framework" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          done
          if [ -e "$APP/Frameworks/XCUITest.framework" ]; then
            find "$APP/Frameworks/XCUITest.framework" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          fi
          BIN="$APP/PlugIns/WebDriverAgentRunner.xctest/WebDriverAgentRunner"
          otool -L "$BIN"
          otool -L "$APP/Frameworks/WebDriverAgentLib.framework/WebDriverAgentLib" || true
          while IFS= read -r fw; do
            [ -n "$fw" ] || continue
            if [ ! -d "$APP/Frameworks/$fw" ] && [ ! -d "$APP/PlugIns/WebDriverAgentRunner.xctest/Frameworks/$fw" ]; then
              echo "missing linked framework $fw"
              exit 1
            fi
          done < <(otool -L "$BIN" | sed -n 's/.*@rpath\/\([^/]*\.framework\)\/.*/\1/p')
          rm -f "$OUT_IPA"
          zip -r -y "$OUT_IPA" Payload
          test -s "$OUT_IPA"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCTest.framework/"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCUIAutomation.framework/"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCTAutomationSupport.framework/"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCTestCore.framework/"
          if unzip -l "$OUT_IPA" | grep -E "dSYM|_CodeSignature|[.]ldid|embedded.mobileprovision"; then
            echo "payload residue"
            exit 1
          fi

      - name: List IPA contents
        run: |
          set -eux
          ls -la "$OUT_IPA"
          unzip -l "$OUT_IPA"

      - uses: actions/upload-artifact@v5
        with:
          name: WebDriverAgent-TrollStore
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
