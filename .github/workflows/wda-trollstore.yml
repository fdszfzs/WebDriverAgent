name: wda-trollstore
"on":
  workflow_dispatch:
env:
  OUT_IPA: ${{ github.workspace }}/WebDriverAgent-TrollStore.ipa
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build unsigned (upstream script)
        run: sh Scripts/ci/build-real.sh
        env:
          DERIVED_DATA_PATH: appium_wda_ios
          SCHEME: WebDriverAgentRunner
          DESTINATION: generic/platform=iOS
          WD: appium_wda_ios/Build/Products/Debug-iphoneos
          ZIP_PKG_NAME: wda-upstream.zip

      - name: Fake-sign + package TrollStore IPA
        run: |
          set -eux
          rm -rf wda-up Payload && mkdir wda-up Payload
          unzip -q wda-upstream.zip -d wda-up
          cp -R wda-up/WebDriverAgentRunner-Runner.app Payload/
          rm -rf Payload/WebDriverAgentRunner-Runner.app/PlugIns/*.dSYM
          find Payload -name '.ldid*' -delete
          find Payload -name '*.dSYM' -prune -o -type f -print | head -30
          rm -f "$OUT_IPA"
          zip -r "$OUT_IPA" Payload
          unzip -l "$OUT_IPA" | head -30

      - name: List output (self-diagnosing)
        run: ls -la "${{ github.workspace }}" | head -30; ls -la "$OUT_IPA"

      - uses: actions/upload-artifact@v5
        with:
          name: WebDriverAgent-TrollStore
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
