name: wda-trollstore
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build unsigned (upstream script)
        run: sh Scripts/ci/build-real.sh
        env:
          DERIVED_DATA_PATH: appium_wda_ios
          SCHEME: WebDriverAgentRunner
          DESTINATION: generic/platform=iOS
          WD: appium_wda_ios/Build/Products/Debug-iphoneos
          ZIP_PKG_NAME: wda-upstream.zip

      - name: Fake-sign + package TrollStore IPA
        run: |
          set -eux
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)/Contents/Developer" || true
          brew install ldid
          rm -rf wda-up Payload && mkdir wda-up Payload
          unzip -q wda-upstream.zip -d wda-up
          cp -R wda-up/WebDriverAgentRunner-Runner.app Payload/
          find Payload -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && ldid -S "$1"' _ {} \;
          zip -r WebDriverAgent-TrollStore.ipa Payload
          unzip -l WebDriverAgent-TrollStore.ipa | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-TrollStore
          path: WebDriverAgent-TrollStore.ipa
