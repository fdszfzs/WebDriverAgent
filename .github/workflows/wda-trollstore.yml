name: wda-trollstore
"on":
  workflow_dispatch:
env:
  OUT_IPA: ${{ github.workspace }}/WebDriverAgent-TrollStore.ipa
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build WebDriverAgentRunner Release iphoneos, fully unsigned
        run: >
          xcodebuild clean build
          -project WebDriverAgent.xcodeproj
          -scheme WebDriverAgentRunner
          -destination 'generic/platform=iOS'
          -configuration Release
          -derivedDataPath appium_wda_ios
          ARCHS=arm64
          IPHONEOS_DEPLOYMENT_TARGET=15.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Assemble clean Payload (Runner.app + Frameworks only)
        run: |
          set -eux
          SRC=$(find appium_wda_ios/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)
          test -n "$SRC"
          rm -rf Payload && mkdir Payload
          cp -R "$SRC" Payload/
          rm -rf Payload/WebDriverAgentRunner-Runner.app/PlugIns/*.dSYM
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/XC*.framework
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/Testing.framework
          rm -f Payload/WebDriverAgentRunner-Runner.app/Frameworks/libXCTestSwiftSupport.dylib
          find Payload -name '.ldid*' -delete
          rm -f "$OUT_IPA"
          zip -r "$OUT_IPA" Payload
          unzip -l "$OUT_IPA" | head -30

      - name: Embed XCTest runtime (tap-launch needs it in-app)
        run: |
          set -eux
          DEV=$(xcode-select -p)
          FW=$DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks
          PRIV=$DEV/Platforms/iPhoneOS.platform/Developer/Library/PrivateFrameworks
          ls "$FW" | head -40
          ls "$PRIV" | head -40
          APP=Payload/WebDriverAgentRunner-Runner.app
          test -d "$FW/XCTest.framework"
          cp -R "$FW/XCTest.framework" "$APP/Frameworks/"
          test -d "$FW/XCUITest.framework"
          cp -R "$FW/XCUITest.framework" "$APP/Frameworks/"
          if [ -d "$PRIV/XCTestAutomationSupport.framework" ]; then
            cp -R "$PRIV/XCTestAutomationSupport.framework" "$APP/Frameworks/"
          elif [ -d "$PRIV/XCTAutomationSupport.framework" ]; then
            cp -R "$PRIV/XCTAutomationSupport.framework" "$APP/Frameworks/"
          else
            echo "AutomationSupport absent (continuing)"
          fi
          rm -f "$OUT_IPA"
          zip -r "$OUT_IPA" Payload
          unzip -l "$OUT_IPA" | grep -E "Frameworks|XCTest" | head -40

      - name: List output (self-diagnosing)
        run: ls -la "${{ github.workspace }}" | head -30; ls -la "$OUT_IPA"

      - uses: actions/upload-artifact@v5
        with:
          name: WebDriverAgent-TrollStore
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
