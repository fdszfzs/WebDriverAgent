name: wda-trollstore
"on":
  workflow_dispatch:
env:
  OUT_IPA: ${{ github.workspace }}/WebDriverAgent-TrollStore.ipa
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build WebDriverAgentRunner Release iphoneos, fully unsigned
        run: >
          xcodebuild clean build
          -project WebDriverAgent.xcodeproj
          -scheme WebDriverAgentRunner
          -destination "generic/platform=iOS"
          -configuration Release
          -derivedDataPath appium_wda_ios
          ARCHS=arm64
          IPHONEOS_DEPLOYMENT_TARGET=15.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA with XCTest and XCUITest
        run: |
          set -eux
          SRC=$(find appium_wda_ios/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "WebDriverAgentRunner-Runner.app" | head -1)
          test -n "$SRC"
          test -d "$SRC"
          rm -rf Payload
          mkdir Payload
          cp -R "$SRC" Payload/
          APP=Payload/WebDriverAgentRunner-Runner.app
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} +
          find "$APP" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$APP" -name ".ldid*" -delete
          find "$APP" -name "embedded.mobileprovision" -delete
          DEV=$(xcode-select -p)
          FW="$DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks"
          mkdir -p "$APP/Frameworks"
          for name in XCTest XCUITest; do
            if [ ! -d "$APP/Frameworks/${name}.framework" ]; then
              test -d "$FW/${name}.framework"
              cp -R "$FW/${name}.framework" "$APP/Frameworks/"
            fi
            test -d "$APP/Frameworks/${name}.framework"
            find "$APP/Frameworks/${name}.framework" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          done
          rm -f "$OUT_IPA"
          zip -r -y "$OUT_IPA" Payload
          test -s "$OUT_IPA"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCTest.framework/"
          unzip -l "$OUT_IPA" | grep -q "Frameworks/XCUITest.framework/"
          if unzip -l "$OUT_IPA" | grep -E "dSYM|_CodeSignature|[.]ldid|embedded.mobileprovision"; then
            echo "payload residue"
            exit 1
          fi

      - name: List IPA contents
        run: |
          set -eux
          ls -la "$OUT_IPA"
          unzip -l "$OUT_IPA"

      - uses: actions/upload-artifact@v5
        with:
          name: WebDriverAgent-TrollStore
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
