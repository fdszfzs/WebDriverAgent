name: wda-trollstore
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install carthage ldid

      - name: Bootstrap deps
        run: ./Scripts/bootstrap.sh -d

      - name: Build unsigned (iOS 15 target, this phone is 15.8)
        run: >
          xcodebuild build
          -scheme WebDriverAgentRunner
          -destination 'generic/platform=iOS'
          -configuration Release
          -derivedDataPath ./build
          IPHONEOS_DEPLOYMENT_TARGET=15.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Fake-sign + package TrollStore IPA
        run: |
          set -eux
          APP=$(find build -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          find Payload -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && ldid -S "$1"' _ {} \;
          zip -r WebDriverAgent-TrollStore.ipa Payload
          unzip -l WebDriverAgent-TrollStore.ipa | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-TrollStore
          path: WebDriverAgent-TrollStore.ipa
